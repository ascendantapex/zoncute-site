backend:
  name: github
  repo: ascendantapex/zoncute-site
  branch: main
  base_url: https://zoncute-cms-auth.josemiguelpineiroperez.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Productos"
    files:
      - name: "catalog"
        label: "Catalogo (los 5 productos)"
        file: "products.json"
        fields:
          - label: "Productos"
            name: "products"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID interno", name: "id", widget: "string" }
              - label: "Tipo de flor"
                name: "tag"
                widget: "select"
                options: ["daisy", "pansy"]
              - { label: "Imagen", name: "img", widget: "image" }
              - { label: "Texto alternativo de la imagen", name: "alt", widget: "string" }
              - { label: "Numero de placa", name: "plateNo", widget: "string" }
              - { label: "Titulo del producto", name: "title", widget: "string" }
              - label: "Especificaciones"
                name: "specs"
                widget: "list"
                fields:
                  - { label: "Numero", name: "value", widget: "string" }
                  - { label: "Etiqueta", name: "unit", widget: "string" }
              - label: "Las 5 caracteristicas"
                name: "features"
                widget: "list"
                field: { label: "Caracteristica", name: "feature", widget: "string" }
              - { label: "Precio actual (USD)", name: "priceNow", widget: "number", value_type: "float" }
              - { label: "Precio de lista (USD)", name: "priceWas", widget: "number", value_type: "float" }
              - { label: "Rating (0 a 5)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5 }
              - { label: "Numero de resenas", name: "reviews", widget: "number", value_type: "int" }
              - { label: "Link de Amazon", name: "url", widget: "string" }
